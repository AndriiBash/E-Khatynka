<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Реєстрація – Є-Хатинка</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/css/tokens.css" />
  <link rel="stylesheet" href="src/css/auth.css" />
</head>
<body>

  <div class="auth">
    <section class="auth__brand">
      <div class="auth__brand-top">Є-Хатинка<span class="auth__brand-dot">.</span></div>

      <div class="auth__brand-mid">
        <h1>Смак, який завжди поруч</h1>
        <p>Свіжа випічка щоранку, зручне замовлення онлайн і рекомендації, підібрані спеціально під ваш настрій.</p>
      </div>

      <div class="auth__brand-icons" aria-hidden="true">
        <span>🥐</span><span>🍞</span><span>🍰</span><span>☕</span>
      </div>
    </section>

    <section class="auth__panel">
      <div class="auth__form-wrap">
        <div class="session-banner" id="already-logged-in"></div>

        <h2>Створити акаунт</h2>
        <p class="auth__subtitle">Це займе не більше хвилини</p>

        <form id="register-form" novalidate>
          <div class="field">
            <label for="fullName">Ім'я та прізвище</label>
            <input type="text" id="fullName" name="fullName" autocomplete="name" />
            <span class="field-error" id="fullName-error"></span>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" />
            <span class="field-error" id="email-error"></span>
          </div>

          <div class="field">
            <label for="phone">Телефон</label>
            <input type="tel" id="phone" name="phone" placeholder="+380XXXXXXXXX" autocomplete="tel" />
            <span class="field-error" id="phone-error"></span>
          </div>

          <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" autocomplete="new-password" />
            <span class="field-error" id="password-error"></span>
          </div>

          <div class="field">
            <label for="passwordConfirm">Підтвердження пароля</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password" />
            <span class="field-error" id="passwordConfirm-error"></span>
          </div>

          <div class="field field--checkbox">
            <input type="checkbox" id="agree" name="agree" />
            <label for="agree">Погоджуюсь з умовами використання та політикою конфіденційності</label>
          </div>
          <span class="field-error" id="agree-error"></span>

          <button type="submit" class="btn--primary">Зареєструватися</button>

          <div class="form-message" id="form-message"></div>
        </form>

        <p class="auth__switch">Вже є акаунт? <a href="login.html">Увійти</a></p>
      </div>
    </section>
  </div>

  <script type="module" src="dist/js/auth.js"></script>
</body>
</html>
